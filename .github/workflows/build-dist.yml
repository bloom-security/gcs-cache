name: build-dist

# Rebuilds the compiled dist/ bundle on a GitHub-hosted runner (public npm,
# not the org's blocked proxy) and commits it back to the branch. Needed
# because the runner executes dist/, not src/, and the org npm policy blocks
# the build toolchain (typescript, ncc, ...) on the self-hosted network.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Commit rebuilt dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "dist unchanged"
          else
            git commit -m "build: rebuild dist"
            git push
          fi
